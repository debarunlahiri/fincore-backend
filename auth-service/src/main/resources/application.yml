server:
  port: 8081
  shutdown: graceful
  # request limits: bound what one connection or one request can cost
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB
    max-connections: 4000
    accept-count: 200
    threads:
      max: 200
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore_auth}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fincore:
  kafka:
    # false => events are only logged (handy for running a single service without a broker)
    enabled: ${KAFKA_ENABLED:true}
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  security:
    jwt:
      # Base64 encoded, >= 32 bytes, shared by all services. Override with JWT_SECRET outside local development.
      secret: ${JWT_SECRET:ZmluY29yZS1kZXYtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2}
      access-ttl: 5m
      refresh-ttl: 7d
  outbox:
    batch-size: 50
    max-attempts: 5
    poll-interval-ms: 1000
  bootstrap-admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@fincore.local}
    password: ${ADMIN_PASSWORD:ChangeMe!123}

logging:
  level:
    # an unreachable trace collector must not flood the log with stack traces
    io.opentelemetry.exporter: OFF
