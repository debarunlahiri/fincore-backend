server:
  port: 8082
  shutdown: graceful
  # request limits: bound what one connection or one request can cost
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB
    max-connections: 4000
    accept-count: 200
    threads:
      max: 200
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: customer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore_customer}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fincore:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  security:
    jwt:
      secret: ${JWT_SECRET:ZmluY29yZS1kZXYtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2}
  outbox:
    batch-size: 50
    max-attempts: 5
    poll-interval-ms: 1000

logging:
  level:
    # an unreachable trace collector must not flood the log with stack traces
    io.opentelemetry.exporter: OFF
