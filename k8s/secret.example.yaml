# EXAMPLE ONLY. Never commit real values: create the secret out of band, e.g.
#   kubectl create secret generic fincore-secrets \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=INTERNAL_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: fincore-secrets
type: Opaque
stringData:
  DB_USERNAME: change-me
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-base64-32-bytes-or-more
  INTERNAL_API_KEY: change-me
  ADMIN_PASSWORD: change-me
