apiVersion: v1
kind: ConfigMap
metadata:
  name: fincore-config
  labels:
    part-of: fincore
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_ENABLED: "true"
  # one database per service on a shared Postgres (use separate instances/clusters in production)
  AUTH_DB_URL: jdbc:postgresql://postgres:5432/fincore_auth
  CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/fincore_customer
  CORE_DB_URL: jdbc:postgresql://postgres:5432/fincore_core
  PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/fincore_payment
  NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/fincore_notification
  SCHEDULER_DB_URL: jdbc:postgresql://postgres:5432/fincore_scheduler
  # service discovery through Kubernetes DNS (Service names)
  AUTH_SERVICE_URL: http://auth-service
  CUSTOMER_SERVICE_URL: http://customer-service
  CORE_SERVICE_URL: http://banking-core
  PAYMENT_SERVICE_URL: http://payment-service
  SCHEDULER_SERVICE_URL: http://scheduler-service
  SPRING_PROFILES_ACTIVE: "prod"
  RATELIMIT_STORE: "redis"
