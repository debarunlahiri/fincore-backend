name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check formatting
        run: mvn -B -q spotless:check

      # Docker is preinstalled on ubuntu-latest, which the Testcontainers PostgreSQL tests need.
      # Builds and tests every module (common, common-data, gateway and the six services).
      - name: Build and test
        run: mvn -B verify

  images:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - api-gateway
          - auth-service
          - customer-service
          - banking-core
          - payment-service
          - notification-service
          - scheduler-service
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --build-arg MODULE=${{ matrix.module }} -t fincore/${{ matrix.module }}:${{ github.sha }} .
