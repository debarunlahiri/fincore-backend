server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore_payment}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fincore:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  security:
    jwt:
      secret: ${JWT_SECRET:ZmluY29yZS1kZXYtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2}
  clients:
    core:
      base-url: ${CORE_SERVICE_URL:http://localhost:8083}
  payments:
    recovery-min-age-seconds: 60
    recovery-interval-ms: 30000
  outbox:
    batch-size: 50
    max-attempts: 5
    poll-interval-ms: 1000

# Retries are safe because the ledger endpoints are idempotent on the payment id. They and the breaker apply only
# to DependencyUnavailableException (network failure / 5xx), never to business rejections like INSUFFICIENT_FUNDS.
resilience4j:
  retry:
    instances:
      ledger:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.fincore.common.exception.DependencyUnavailableException
  circuitbreaker:
    instances:
      ledger:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        record-exceptions:
          - com.fincore.common.exception.DependencyUnavailableException
