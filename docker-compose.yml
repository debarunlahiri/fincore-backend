# Whole platform:   scripts/up.sh   (frees the ports first)   or   docker compose up --build
# A host port busy? Move it, e.g.  REDIS_HOST_PORT=6380 docker compose up -d   (POSTGRES_/KAFKA_/JAEGER_*_HOST_PORT work too)
# Infrastructure only (run services from your IDE):   docker compose up -d postgres kafka redis

x-service: &service
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_started
  environment: &service-env
    DB_USERNAME: fincore
    DB_PASSWORD: fincore
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_ENABLED: "true"
    # colored log levels in `docker compose logs`
    SPRING_OUTPUT_ANSI_ENABLED: always
    # the dev defaults below are for local use only; override them anywhere else
    JWT_SECRET: ${JWT_SECRET:-ZmluY29yZS1kZXYtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    CUSTOMER_SERVICE_URL: http://customer-service:8082
    CORE_SERVICE_URL: http://banking-core:8083
    OTLP_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  # Trace UI on http://localhost:16686 (OTLP over HTTP on 4318).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_HOST_PORT:-4318}:4318"

  # Single-node KRaft broker. localhost:9092 for the host, kafka:29092 inside the compose network.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    depends_on: [auth-service, customer-service, banking-core, payment-service, scheduler-service, redis, jaeger]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      CORE_SERVICE_URL: http://banking-core:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      SCHEDULER_SERVICE_URL: http://scheduler-service:8086
      REDIS_HOST: redis
      REDIS_ENABLED: "true"
      RATELIMIT_STORE: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "9780:9780"
      # health and metrics, not exposed beyond this machine
      - "127.0.0.1:9781:9781"

  auth-service:
    <<: *service
    build: { context: ., args: { MODULE: auth-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fincore_auth
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!123}
    ports:
      - "127.0.0.1:8081:8081"

  customer-service:
    <<: *service
    build: { context: ., args: { MODULE: customer-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fincore_customer
    ports:
      - "127.0.0.1:8082:8082"

  banking-core:
    <<: *service
    build: { context: ., args: { MODULE: banking-core } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fincore_core
      # where customers open a payment QR: the web app address (the Vercel URL when it is hosted there)
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      # signs fixed-amount payment links so the payer cannot edit the amount
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-dev-qr-signing-secret-change-me}
      # guest (not signed in) payments through Razorpay; test keys are fine
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:8083:8083"

  payment-service:
    <<: *service
    build: { context: ., args: { MODULE: payment-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fincore_payment
    ports:
      - "127.0.0.1:8084:8084"

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fincore_notification
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Fincore}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-${SMTP_USER:-}}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-8}
      MAIL_DISPATCH_DELAY: ${MAIL_DISPATCH_DELAY:-PT5S}
    ports:
      - "127.0.0.1:8085:8085"

  scheduler-service:
    <<: *service
    build: { context: ., args: { MODULE: scheduler-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/fincore_scheduler
    ports:
      - "127.0.0.1:8086:8086"

volumes:
  pgdata:
