server:
  port: 8085
  shutdown: graceful
  # request limits: bound what one connection or one request can cost
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 64KB
    max-swallow-size: 1MB
    max-connections: 4000
    accept-count: 200
    threads:
      max: 200
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore_notification}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      # SMTP_SECURE=true: TLS on connect (port 465). false: STARTTLS (port 587)
      mail.smtp.ssl.enable: ${SMTP_SECURE:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fincore:
  mail:
    # no SMTP_HOST/SMTP_USER set: emails are recorded but not sent
    enabled: ${MAIL_ENABLED:true}
    from-name: ${MAIL_FROM_NAME:Fincore}
    from-address: ${MAIL_FROM_ADDRESS:${SMTP_USER:}}
    # failed emails are retried 30s, 1m, 2m, 4m ... up to 1h apart, until this many attempts
    max-attempts: ${MAIL_MAX_ATTEMPTS:8}
    dispatch-delay: ${MAIL_DISPATCH_DELAY:PT5S}
    batch-size: 20
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  security:
    jwt:
      secret: ${JWT_SECRET:ZmluY29yZS1kZXYtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2}
  outbox:
    batch-size: 50
    max-attempts: 5
    poll-interval-ms: 1000

logging:
  level:
    # an unreachable trace collector must not flood the log with stack traces
    io.opentelemetry.exporter: OFF
