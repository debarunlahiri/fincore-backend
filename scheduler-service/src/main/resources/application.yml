server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: scheduler-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore_scheduler}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fincore:
  zone: Asia/Kolkata
  internal:
    api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  security:
    jwt:
      secret: ${JWT_SECRET:ZmluY29yZS1kZXYtb25seS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2}
  clients:
    core:
      base-url: ${CORE_SERVICE_URL:http://localhost:8083}
  scheduler:
    # 06:00 every day in fincore.zone
    standing-instructions-cron: "0 0 6 * * *"

# Retries are safe: reads, and a transfer with a deterministic idempotency key. They and the breaker apply only
# to DependencyUnavailableException, never to business rejections such as INSUFFICIENT_FUNDS.
resilience4j:
  retry:
    instances:
      core:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - com.fincore.common.exception.DependencyUnavailableException
  circuitbreaker:
    instances:
      core:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        record-exceptions:
          - com.fincore.common.exception.DependencyUnavailableException
